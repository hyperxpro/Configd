\* SnapshotInstallSpec TRUNCATE-BEFORE-PERSIST counterexample config (test-the-tester).
\*
\* PERSIST_BEFORE_TRUNCATE = FALSE enables the pre-fix DEFECT: TruncateWal can delete the
\* WAL prefix [walBase .. S] while the snapshot bytes at S are NOT yet durable
\* (durIndex < S). On a crash/restart the recovered state has a HOLE at the indices in
\* (durIndex .. walBase-1] -- committed entries that live in neither the durable snapshot
\* nor the durable WAL: the snapshot was taken in RAM only, the WAL prefix was deleted
\* durably, and on restart the state machine is never restored, so all committed state
\* below the snapshot point is silently gone.
\*
\* TLC MUST report `DurablePrefix is violated`. This proves the invariant is non-vacuous
\* and that the durability model genuinely distinguishes the fixed persist-before-truncate
\* ordering from the broken truncate-before-persist ordering. Run:
\*   java -jar tla2tools.jar -config SnapshotInstallSpec-truncatebeforepersist.cfg SnapshotInstallSpec.tla
\* Expected: "Invariant DurablePrefix is violated" with a short trace.
\*
\* Small bounds keep the counterexample fast.
\*
\* The PRODUCTION cfgs (spec/SnapshotInstallSpec.cfg, gates/spec-smoke/...) set
\* PERSIST_BEFORE_TRUNCATE = TRUE and DurablePrefix HOLDS.

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 2
    MaxIndex = 2
    PERSIST_BEFORE_TRUNCATE = FALSE

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    DurablePrefix

\* TLC Model Checking Configuration for ConsensusSpec
\*
\* Model parameters sized for tractable checking of joint consensus:
\*   - 3 nodes: minimum for meaningful quorum behavior (majority = 2)
\*   - MaxTerm = 2: leader change + one re-election (reduced from 3 -- see below)
\*   - MaxLogLen = 3: no-op + joint + final reconfig entries
\*   - 2 values: sufficient for distinguishing writes
\*
\* The `acked` variable (a set of <<index,term>> ack positions, capped to one element),
\* ClientAck, and AckImpliesCommitted multiply the reachable space against the existing
\* term/reconfig product. At MaxTerm=3/MaxLogLen=3 the full run did not exhaust within 40
\* min (16.6M states / 4.19M distinct / depth 19, 1.2M still queued; 0 violations in the
\* explored prefix). MaxTerm is reduced to 2 for the full run: this still covers a full
\* election + a re-election, joint reconfiguration (no-op -> joint -> final), client
\* writes, edge propagation, AND the commit-confirmed ack cycle with AckImpliesCommitted --
\* the invariant's reachability is preserved. The ack-before-commit counterexample is
\* proven fast and at full term dynamics separately by spec/ConsensusSpec-ackonappend.cfg
\* (see tlc-results.md for the full run numbers).

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxTerm = 2
    MaxLogLen = 3
    Values = {v1, v2}
    ACK_ON_APPEND = FALSE

INIT Init

NEXT Next

\* Deadlock at model bounds (MaxTerm/MaxLogLen reached) is expected, not a bug.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ElectionSafety
    StateMachineSafety
    LeaderCompleteness
    LogMatching
    VersionMonotonicity
    ReconfigSafety
    SingleServerInvariant
    NoOpBeforeReconfig
    AckImpliesCommitted

\* NoStaleOverwrite is not in this list: it was identical to StateMachineSafety.
\* LeaderCompleteness and VersionMonotonicity (strengthened) cover the same ground.

\* Liveness properties require the SPECIFICATION directive with fairness.
\* Uncomment the block below AND comment out the INIT/NEXT lines above
\* to check liveness (substantially slower -- expect 10x+ runtime):
\* SPECIFICATION Spec
\* PROPERTIES
\*     EdgePropagationLiveness

\* Symmetry reduction: nodes and values are interchangeable.
\* Uncomment if TLC supports symmetry sets for your model:
\* SYMMETRY
\*     Permutations(Nodes) \union Permutations(Values)

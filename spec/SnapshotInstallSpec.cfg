\* TLC Model Checking Configuration for SnapshotInstallSpec.
\*
\* Closes SPEC-GAP-6 / PA-5027.
\*
\* Parameters chosen for tractable checking:
\*   - 3 nodes
\*   - MaxTerm = 3
\*   - MaxIndex = 4 (enough for snapshot-of-snapshot scenarios)
\*
\* Verified 2026-04-17 on Java 25 / TLC 2026.04.09: 6.0M states generated,
\* 847K distinct, depth 14, ~21s on 2 cores. All five invariants PASS.

\* RR-003 (Session 2): durability model added — durable-vs-RAM snapshot (durIndex),
\* durable WAL suffix (walBase/walTip), persist/truncate/crash-restart actions,
\* PERSIST_BEFORE_TRUNCATE = TRUE (fixed ordering) + DurablePrefix /
\* RecoveredCoversCommitted invariants. This is a FUNDAMENTAL state-space change, not a
\* marginal one: 4 new per-node integer variables (each 0..MaxIndex) PLUS an always-enabled
\* CrashRestart action multiply the reachable space by roughly (MaxIndex+1)^(3*4). The
\* historical MaxIndex=4 (847K distinct, 2m39s) is no longer tractable; MaxIndex is reduced
\* to 2 for the full run, which still exercises snapshot-of-snapshot + the full durability
\* cycle (commit -> WAL -> RAM snapshot -> persist -> truncate -> crash/restart) and the
\* install path across multiple indices. This is the >3x-historical-blowup bound reduction
\* the B7 task authorizes — bound adequacy owned by Session 2 (see tlc-results.md). The
\* smoke cfg uses MaxIndex=1; the DurablePrefix non-vacuity is proven fast and separately by
\* spec/SnapshotInstallSpec-truncatebeforepersist.cfg.

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 2
    MaxIndex = 2
    PERSIST_BEFORE_TRUNCATE = TRUE

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SnapshotBoundedByCommitted
    SnapshotMatching
    NoCommitRevert
    InflightTermMonotonic
    DurablePrefix
    RecoveredCoversCommitted

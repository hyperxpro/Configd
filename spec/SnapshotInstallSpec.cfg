\* TLC Model Checking Configuration for SnapshotInstallSpec.
\*
\* Parameters chosen for tractable checking:
\*   - 3 nodes
\*   - MaxTerm = 2
\*   - MaxIndex = 2 (enough for snapshot-of-snapshot scenarios)
\*
\* The durability model (durIndex/walBase/walTip and the persist/truncate/crash-restart
\* actions, plus the DurablePrefix / RecoveredCoversCommitted invariants) adds four new
\* per-node integer variables and an always-enabled CrashRestart action, which multiplies
\* the reachable state space by roughly (MaxIndex+1)^(3*4). A larger MaxIndex (e.g. 4) is
\* no longer tractable at that state-space size; MaxIndex = 2 still exercises
\* snapshot-of-snapshot scenarios and the full durability cycle (commit -> WAL -> RAM
\* snapshot -> persist -> truncate -> crash/restart) plus the install path across multiple
\* indices. The smoke cfg uses MaxIndex = 1; the DurablePrefix non-vacuity is proven fast
\* and separately by spec/SnapshotInstallSpec-truncatebeforepersist.cfg (see
\* tlc-results.md for the full run numbers).

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 2
    MaxIndex = 2
    PERSIST_BEFORE_TRUNCATE = TRUE

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SnapshotBoundedByCommitted
    SnapshotMatching
    NoCommitRevert
    InflightTermMonotonic
    DurablePrefix
    RecoveredCoversCommitted

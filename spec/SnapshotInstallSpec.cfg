\* TLC Model Checking Configuration for SnapshotInstallSpec.
\*
\* Closes SPEC-GAP-6 / PA-5027.
\*
\* Parameters chosen for tractable checking:
\*   - 3 nodes
\*   - MaxTerm = 3
\*   - MaxIndex = 4 (enough for snapshot-of-snapshot scenarios)
\*
\* Verified 2026-04-17 on Java 25 / TLC 2026.04.09: 6.0M states generated,
\* 847K distinct, depth 14, ~21s on 2 cores. All five invariants PASS.

\* RR-003 (Session 2): durability model added — durable-vs-RAM snapshot, durable WAL
\* suffix, persist/truncate/crash-restart actions, PERSIST_BEFORE_TRUNCATE = TRUE (fixed
\* ordering) + DurablePrefix / RecoveredCoversCommitted invariants. The four new actions
\* enlarge the state space; MaxIndex reduced 4 -> 3 to keep the full run tractable (bound
\* adequacy owned by Session 2 — see tlc-results.md).

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 3
    MaxIndex = 3
    PERSIST_BEFORE_TRUNCATE = TRUE

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SnapshotBoundedByCommitted
    SnapshotMatching
    NoCommitRevert
    InflightTermMonotonic
    DurablePrefix
    RecoveredCoversCommitted

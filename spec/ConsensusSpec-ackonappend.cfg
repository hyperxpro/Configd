\* ConsensusSpec ACK-ON-APPEND counterexample config (test-the-tester).
\*
\* This cfg sets ACK_ON_APPEND = TRUE, which enables the pre-fix DEFECT action
\* `ClientAckOnAppend` -- the leader acknowledges a client write on LOCAL APPEND, before
\* the entry is committed. TLC MUST report `AckImpliesCommitted` VIOLATED: a write
\* acknowledged on a leader that subsequently loses an election has its slot truncated
\* and replaced, so no node ends up holding that committed <<index, term>> -- an
\* acknowledged write that vanished on failover.
\*
\* This is the spec-level proof that the AckImpliesCommitted invariant is NON-VACUOUS
\* and that the ConsensusSpec ClientAck model genuinely distinguishes the fixed
\* (commit-confirmed) ack from the broken (ack-on-append) ack. Run:
\*   java -jar tla2tools.jar -config ConsensusSpec-ackonappend.cfg ConsensusSpec.tla
\* Expected: TLC prints "Invariant AckImpliesCommitted is violated" with a trace.
\*
\* Small bounds (MaxTerm=2, MaxLogLen=2) keep the counterexample fast (seconds) and the
\* trace short -- an election that truncates an acked-on-append slot needs only one
\* leadership change.
\*
\* The PRODUCTION cfgs (spec/ConsensusSpec.cfg, gates/spec-smoke/ConsensusSpec-smoke.cfg)
\* set ACK_ON_APPEND = FALSE and AckImpliesCommitted HOLDS.

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxTerm = 2
    MaxLogLen = 2
    Values = {v1, v2}
    ACK_ON_APPEND = TRUE

INIT Init

NEXT Next

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    AckImpliesCommitted

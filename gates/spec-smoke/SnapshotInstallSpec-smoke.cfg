\* SnapshotInstallSpec SMOKE config — gate-1 step (d). Derived from spec/SnapshotInstallSpec.cfg.
\*
\* Checks the SAME invariants as the full config (none dropped); only the
\* state-space bound is reduced.
\*
\* RR-003 (Session 2): this spec gained a durability model — durable-vs-RAM snapshot
\* (durIndex), a durable WAL suffix (walBase/walTip), persist/truncate/crash-restart
\* actions, and PERSIST_BEFORE_TRUNCATE = TRUE (the fixed ordering). Two new invariants:
\* DurablePrefix (the persisted snapshot + contiguous WAL suffix reconstruct all
\* committed) and RecoveredCoversCommitted. The four new actions + 4 per-node durability
\* variables + an always-enabled CrashRestart enlarge the state space sharply, so the
\* SMOKE bound is MaxIndex = 1, MaxTerm = 2: the full durability CYCLE
\* (commit -> replicate-to-WAL -> RAM snapshot -> persist -> truncate -> crash/restart,
\* and the install path) is exercised on a single index, which is exactly what makes
\* DurablePrefix non-trivially reachable. Deeper index chains are full-run territory
\* (the full cfg uses MaxIndex = 3; bound adequacy owned by Session 2, see tlc-results.md).
\*
\* PERSIST_BEFORE_TRUNCATE = TRUE is the FIXED model; the defect counterexample lives in
\* spec/SnapshotInstallSpec-truncatebeforepersist.cfg (PERSIST_BEFORE_TRUNCATE = FALSE,
\* DurablePrefix VIOLATED — the silent-data-loss proof).
\*
\* SMOKE RUN != FULL ASSURANCE — Session 2 owns bound adequacy.

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 2
    MaxIndex = 1
    PERSIST_BEFORE_TRUNCATE = TRUE

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SnapshotBoundedByCommitted
    SnapshotMatching
    NoCommitRevert
    InflightTermMonotonic
    DurablePrefix
    RecoveredCoversCommitted

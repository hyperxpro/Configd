\* SnapshotInstallSpec SMOKE config — gate-1 step (d). Derived from spec/SnapshotInstallSpec.cfg.
\*
\* Checks the SAME 5 invariants as the full config (none dropped); only the
\* state-space bound is reduced:
\*
\*   constant     full run            smoke run
\*   Nodes        {n1,n2,n3}          {n1,n2,n3}   (unchanged — 3 = minimum for real quorum)
\*   MaxTerm      3                   3            (unchanged — full term dynamics)
\*   MaxIndex     4                   3            (snapshot-of-snapshot still reachable at depth 3;
\*                                                  4-deep chains are not)
\*
\* Full run (this audit, 2-vCPU box, tlc2 -workers 2): 6.0M states generated,
\* 847K distinct, "No error", wall 2m39s. (The full cfg's "~21s" header claim
\* is doc drift — registered finding, not fixed here.)
\* Smoke run (same box/command): 703K generated, 116K distinct, "No error",
\* wall 11s.
\*
\* Caveat: measured with CPU credits available; credit-throttled re-run took
\* 36s (~3x). Budget accordingly on slow runners.
\*
\* SMOKE RUN != FULL ASSURANCE — Session 2 owns bound adequacy.

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 3
    MaxIndex = 3

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SnapshotBoundedByCommitted
    SnapshotMatching
    NoCommitRevert
    InflightTermMonotonic

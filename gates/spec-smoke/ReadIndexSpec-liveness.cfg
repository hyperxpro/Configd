\* ReadIndexSpec LIVENESS smoke config (RR-026).
\*
\* Checks the bounded liveness property ReadEventuallyServed under the FAIR
\* specification LiveSpec (Init /\ [][Next]_vars /\ FairNext), where FairNext adds weak
\* fairness to the read-progress actions (CompleteReadIndex, ApplyEntry,
\* ReadHeartbeatAck). Closes RR-026's "no liveness property has ever been checked" gap on
\* this spec.
\*
\* Bounds kept small (the same as the safety smoke) so the liveness check stays within
\* the gate budget — liveness checking is ~10x the safety runtime, so MaxIndex=1.
\*
\* The wrong-fairness vacuity demonstration is in ReadIndexSpec-livenessvacuity.cfg
\* (same property under the UNFAIR Spec → ReadEventuallyServed VIOLATED).

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 2
    MaxIndex = 1

SPECIFICATION LiveSpec

CHECK_DEADLOCK FALSE

PROPERTIES
    ReadEventuallyServed

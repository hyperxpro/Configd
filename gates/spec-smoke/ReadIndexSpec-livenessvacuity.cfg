\* ReadIndexSpec LIVENESS-VACUITY config (wrong-fairness check).
\*
\* Checks ReadEventuallyServed under the UNFAIR base Spec (Init /\ [][Next]_vars) — i.e.
\* WITHOUT the FairNext weak-fairness conjuncts. TLC MUST report the property VIOLATED:
\* with no fairness the model can stutter forever (or never run CompleteReadIndex /
\* ApplyEntry / ReadHeartbeatAck) while a read stays pending on a stable leader, so
\* "eventually served or invalidated" fails.
\*
\* This is the wrong-fairness vacuity demonstration: it proves that the
\* GREEN liveness result under LiveSpec (ReadIndexSpec-liveness.cfg) is earned by the
\* fairness annotations, not vacuous. If this cfg ever passes, the fairness in
\* ReadEventuallyServed / LiveSpec is mis-specified (a property that holds even without
\* fairness is not testing liveness).
\*
\* Expected: TLC prints "Temporal properties were violated" for ReadEventuallyServed.

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 2
    MaxIndex = 1

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

PROPERTIES
    ReadEventuallyServed

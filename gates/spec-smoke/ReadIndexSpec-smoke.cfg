\* ReadIndexSpec SMOKE config — gate-1 step (d). Derived from spec/ReadIndexSpec.cfg.
\*
\* Checks the SAME 5 invariants as the full config (none dropped); only the
\* state-space bound is reduced:
\*
\*   constant     full run            smoke run
\*   Nodes        {n1,n2,n3}          {n1,n2,n3}   (unchanged — 3 = minimum for real quorum)
\*   MaxTerm      2                   2            (unchanged — stale-leader scenarios stay reachable)
\*   MaxIndex     2                   1            (a single committed index; read-after-commit
\*                                                  still exercised, multi-index stale reads are not)
\*
\* Full run (this audit, 2-vCPU box, tlc2 -workers 2): 12.4M states generated,
\* 2.27M distinct, "No error", wall 7m47s. (The full cfg's "~58s" header claim
\* is doc drift — registered finding, not fixed here.)
\* Smoke run (same box/command): 354K generated, 74.9K distinct, "No error",
\* wall 10s.
\*
\* Caveat: measured with CPU credits available; credit-throttled re-run took
\* 29s (~3x). Budget accordingly on slow runners.
\*
\* SMOKE RUN != FULL ASSURANCE — Session 2 owns bound adequacy.

CONSTANTS
    Nodes    = {n1, n2, n3}
    MaxTerm  = 2
    MaxIndex = 1

INIT Init
NEXT Next

\* Bounded model — boundary deadlock is expected, not a bug.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ElectionSafety
    ReadIndexBoundedByMaxIndex
    ReadFreshness
    NoStaleLeaderServe

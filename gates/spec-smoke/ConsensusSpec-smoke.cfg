\* ConsensusSpec SMOKE config — gate-1 step (d). Derived from spec/ConsensusSpec.cfg.
\*
\* Checks the SAME 9 invariants as the full config (none dropped); only the
\* state-space bound is reduced:
\*
\*   constant     full run            smoke run
\*   Nodes        {n1,n2,n3}          {n1,n2,n3}   (unchanged — 3 = minimum for real quorum)
\*   MaxTerm      3                   2            (one election/term change instead of two)
\*   MaxLogLen    3                   3            (unchanged — no-op + joint + final reconfig entries stay reachable)
\*   Values       {v1,v2}             {v1,v2}      (unchanged — keeps write-distinguishing power)
\*
\* Full run (this audit, 2-vCPU box, tlc2 -workers 2): 13.78M states generated,
\* 3.30M distinct, BUILD "No error", wall 14m00s.
\* Smoke run (same box/command): 3.11M generated, 821K distinct, "No error",
\* wall 2m04s — marginally over the ~2-min budget; this is the smallest honest
\* reduction (a further cut to Values={v1} saves only ~7s and loses
\* write-distinguishing power, so it was rejected).
\*
\* Caveat: wall times above were measured with burstable-instance CPU credits
\* available; when the t3a box is credit-throttled the same run (identical
\* 3,110,023 states) took 6m55s (~3.3x). Budget accordingly on slow runners.
\*
\* SMOKE RUN != FULL ASSURANCE — Session 2 owns bound adequacy.

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxTerm = 2
    MaxLogLen = 3
    Values = {v1, v2}

INIT Init

NEXT Next

\* Deadlock at model bounds (MaxTerm/MaxLogLen reached) is expected, not a bug.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ElectionSafety
    StateMachineSafety
    LeaderCompleteness
    LogMatching
    VersionMonotonicity
    ReconfigSafety
    SingleServerInvariant
    NoOpBeforeReconfig

# =============================================================================
# C6 E2E topology (charter §4 C6): 3 control-plane nodes + 3 steady-state edge
# nodes (+ edge4, profile "bootstrap", started mid-load by the scenario script).
#
# Everything speaks mTLS over the REAL production CLI paths:
#   - Raft peer transport AND the --edge-port fan-out endpoint share the server
#     TLS triple (the ConfigdServer single-TlsManager design);
#   - edges present CN=edge-N client certs — the cert DN is the authoritative
#     session identity (C1), and --edge-id carries the same string;
#   - all three CP nodes mount the SAME Ed25519 signing key (--signing-key-file):
#     each node signs its fan-out stream at apply, so failover only verifies if
#     the key is cluster-shared. Edges verify with the exported --verify-key.
#
# Secrets come from ./secrets (deploy/compose/setup-secrets.sh). Images are
# slim JRE layers over host-built shaded jars (gates/e2e-compose-scenario.sh
# stages and builds them; pull_policy: never — nothing comes from a registry).
#
# Heaps are small on purpose: 6-7 JVMs must fit the 2-vCPU/7.7GB gate box.
# Ports publish on host loopback only:
#   cp1..cp3 API  -> 127.0.0.1:18081..18083
#   edge1..edge4  -> 127.0.0.1:18181..18184
# The fan-out port (7070) stays internal to cpnet.
#
# Partition fault (scenario phase 3) = `docker network disconnect` of the victim
# edge from cpnet; observation continues via `docker exec ... curl localhost:8080`
# (network-independent — the reason curl is in the images).
# =============================================================================
name: configd-e2e

# Static container IPs: the partition phase disconnects/reconnects an edge from
# cpnet, and the host-published-port NAT path stays valid only if the container
# comes back with the SAME address (the scenario script reconnects with
# `docker network connect --ip <same-ip>`).
networks:
  cpnet:
    ipam:
      config:
        - subnet: 172.28.0.0/24

x-cp-common: &cp-common
  image: configd-e2e-server:latest
  pull_policy: never
  # B5 acknowledgment: these CP nodes bind --bind-address 0.0.0.0 with app-layer auth OFF (the mTLS here is
  # wantClientAuth=optional, so a certless client is NOT authenticated). ConfigdServer's fail-closed guard
  # (enforceBindNotSilentlyPublic) REFUSES to start an unauthenticated public bind unless the operator
  # explicitly acknowledges it. This is a TRUSTED-NETWORK lab posture (a private compose network on host
  # loopback). A PRODUCTION deployment MUST instead enable real auth (configd.auth.mode=basic|oidc|
  # mtls-with-real-client-auth, or --auth-token) rather than rely on this override. Passed as a -D via
  # JAVA_TOOL_OPTIONS because the override key is camelCase (the systematic CONFIGD_* env mapping lowercases
  # and cannot express it).
  environment:
    JAVA_TOOL_OPTIONS: "-Dconfigd.security.allowInsecurePublicBind=true"
  volumes:
    - ./secrets:/secrets:ro

x-edge-common: &edge-common
  image: configd-e2e-edge:latest
  pull_policy: never
  volumes:
    - ./secrets:/secrets:ro

services:
  cp1:
    <<: *cp-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.11
    command: >-
      --node-id 1 --data-dir /data --peers 2,3
      --bind-address 0.0.0.0 --bind-port 9090 --api-port 8080 --edge-port 7070
      --peer-addresses 1=cp1:9090,2=cp2:9090,3=cp3:9090
      --tls-cert /secrets/server.pem --tls-key /secrets/server-ks.p12
      --tls-trust-store /secrets/server-ts.p12
      --signing-key-file /secrets/signing-key.bin
    ports:
      - "127.0.0.1:18081:8080"

  cp2:
    <<: *cp-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.12
    command: >-
      --node-id 2 --data-dir /data --peers 1,3
      --bind-address 0.0.0.0 --bind-port 9090 --api-port 8080 --edge-port 7070
      --peer-addresses 1=cp1:9090,2=cp2:9090,3=cp3:9090
      --tls-cert /secrets/server.pem --tls-key /secrets/server-ks.p12
      --tls-trust-store /secrets/server-ts.p12
      --signing-key-file /secrets/signing-key.bin
    ports:
      - "127.0.0.1:18082:8080"

  cp3:
    <<: *cp-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.13
    command: >-
      --node-id 3 --data-dir /data --peers 1,2
      --bind-address 0.0.0.0 --bind-port 9090 --api-port 8080 --edge-port 7070
      --peer-addresses 1=cp1:9090,2=cp2:9090,3=cp3:9090
      --tls-cert /secrets/server.pem --tls-key /secrets/server-ks.p12
      --tls-trust-store /secrets/server-ts.p12
      --signing-key-file /secrets/signing-key.bin
    ports:
      - "127.0.0.1:18083:8080"

  # Edges stagger their FIRST fan-out endpoint (cp1/cp2/cp3) so a leader kill
  # exercises failover from a mix of subscription points (round-robin carries on
  # from wherever each edge currently sits).
  edge1:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.21
    command: >-
      --edge-id CN=edge-1 --data-dir /data --api-port 8080
      --fanout-endpoints cp1:7070,cp2:7070,cp3:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge1.pem --tls-key /secrets/edge1-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18181:8080"

  edge2:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.22
    command: >-
      --edge-id CN=edge-2 --data-dir /data --api-port 8080
      --fanout-endpoints cp2:7070,cp3:7070,cp1:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge2.pem --tls-key /secrets/edge2-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18182:8080"

  edge3:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.23
    command: >-
      --edge-id CN=edge-3 --data-dir /data --api-port 8080
      --fanout-endpoints cp3:7070,cp1:7070,cp2:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge3.pem --tls-key /secrets/edge3-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18183:8080"

  # Phase 4: the fresh edge that bootstraps mid-load (zero state, cursor 0 ⇒ the
  # C3 SNAPSHOT_FIRST rule). Started explicitly by the scenario script:
  #   docker compose --profile bootstrap up -d edge4
  edge4:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.24
    profiles: ["bootstrap"]
    command: >-
      --edge-id CN=edge-4 --data-dir /data --api-port 8080
      --fanout-endpoints cp1:7070,cp2:7070,cp3:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge4.pem --tls-key /secrets/edge4-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18184:8080"

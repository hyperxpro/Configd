# E2E topology: 3 control-plane nodes + 3 steady-state edge nodes (+ edge4 bootstrap).
# All speak mTLS over production CLI paths; small heaps by design (6-7 JVMs fit 2-vCPU box).
# Partition fault in scenario = docker network disconnect; edge4 started mid-load by scenario.
# Static container IPs required: partition phase reconnects with same IP.
name: configd-e2e

networks:
  cpnet:
    ipam:
      config:
        - subnet: 172.28.0.0/24

x-cp-common: &cp-common
  image: configd-e2e-server:latest
  pull_policy: never
  # allowInsecurePublicBind needed: bind 0.0.0.0 without auth (trusted lab network only; production must enable real auth).
  environment:
    JAVA_TOOL_OPTIONS: "-Dconfigd.security.allowInsecurePublicBind=true"
  volumes:
    - ./secrets:/secrets:ro

x-edge-common: &edge-common
  image: configd-e2e-edge:latest
  pull_policy: never
  volumes:
    - ./secrets:/secrets:ro

services:
  cp1:
    <<: *cp-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.11
    command: >-
      --node-id 1 --data-dir /data --peers 2,3
      --bind-address 0.0.0.0 --bind-port 9090 --api-port 8080 --edge-port 7070
      --peer-addresses 1=cp1:9090,2=cp2:9090,3=cp3:9090
      --tls-cert /secrets/server.pem --tls-key /secrets/server-ks.p12
      --tls-trust-store /secrets/server-ts.p12
      --signing-key-file /secrets/signing-key.bin
    ports:
      - "127.0.0.1:18081:8080"

  cp2:
    <<: *cp-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.12
    command: >-
      --node-id 2 --data-dir /data --peers 1,3
      --bind-address 0.0.0.0 --bind-port 9090 --api-port 8080 --edge-port 7070
      --peer-addresses 1=cp1:9090,2=cp2:9090,3=cp3:9090
      --tls-cert /secrets/server.pem --tls-key /secrets/server-ks.p12
      --tls-trust-store /secrets/server-ts.p12
      --signing-key-file /secrets/signing-key.bin
    ports:
      - "127.0.0.1:18082:8080"

  cp3:
    <<: *cp-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.13
    command: >-
      --node-id 3 --data-dir /data --peers 1,2
      --bind-address 0.0.0.0 --bind-port 9090 --api-port 8080 --edge-port 7070
      --peer-addresses 1=cp1:9090,2=cp2:9090,3=cp3:9090
      --tls-cert /secrets/server.pem --tls-key /secrets/server-ks.p12
      --tls-trust-store /secrets/server-ts.p12
      --signing-key-file /secrets/signing-key.bin
    ports:
      - "127.0.0.1:18083:8080"

  # Edges stagger first fanout endpoint for failover from different subscription points.
  edge1:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.21
    command: >-
      --edge-id CN=edge-1 --data-dir /data --api-port 8080
      --fanout-endpoints cp1:7070,cp2:7070,cp3:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge1.pem --tls-key /secrets/edge1-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18181:8080"

  edge2:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.22
    command: >-
      --edge-id CN=edge-2 --data-dir /data --api-port 8080
      --fanout-endpoints cp2:7070,cp3:7070,cp1:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge2.pem --tls-key /secrets/edge2-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18182:8080"

  edge3:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.23
    command: >-
      --edge-id CN=edge-3 --data-dir /data --api-port 8080
      --fanout-endpoints cp3:7070,cp1:7070,cp2:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge3.pem --tls-key /secrets/edge3-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18183:8080"

  edge4:
    <<: *edge-common
    networks:
      cpnet:
        ipv4_address: 172.28.0.24
    profiles: ["bootstrap"]
    command: >-
      --edge-id CN=edge-4 --data-dir /data --api-port 8080
      --fanout-endpoints cp1:7070,cp2:7070,cp3:7070
      --verify-key /secrets/verify-key.der
      --tls-cert /secrets/edge4.pem --tls-key /secrets/edge4-ks.p12
      --tls-trust-store /secrets/edge-ts.p12
    ports:
      - "127.0.0.1:18184:8080"

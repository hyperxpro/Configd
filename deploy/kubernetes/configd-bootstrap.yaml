# Configd Bootstrap Job — DESTRUCTIVE: do not re-run against existing cluster.
# Re-running after bootstrap overwrites peer-set and desynchronizes state machine from Raft log on pod restart.
# Apply once before configd-statefulset.yaml. backoffLimit=0: failure = cluster not bootstrapped.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configd-bootstrap
  namespace: configd
  labels:
    app: configd
    component: bootstrap
---
# Deliberately scoped to the single ConfigMap name configd-peers: even with this Role fully
# compromised the blast radius is overwriting that one ConfigMap. Do not widen it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configd-bootstrap
  namespace: configd
  labels:
    app: configd
    component: bootstrap
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["configd-peers"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configd-bootstrap
  namespace: configd
  labels:
    app: configd
    component: bootstrap
subjects:
  - kind: ServiceAccount
    name: configd-bootstrap
    namespace: configd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configd-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configd-bootstrap
  namespace: configd
  labels:
    app: configd
    component: bootstrap
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: configd
        component: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: configd-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # IMPORTANT: replace with digest reference at deploy time (configd@sha256:...).
          image: configd:GIT_SHA
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - "/bin/sh"
            - "-eu"
            - "-c"
            - |
              REPLICAS="${CONFIGD_REPLICAS:-3}"
              PEERS=""
              i=0
              while [ "$i" -lt "$REPLICAS" ]; do
                if [ -n "$PEERS" ]; then
                  PEERS="${PEERS},configd-${i}"
                else
                  PEERS="configd-${i}"
                fi
                i=$((i+1))
              done
              echo "Generated peer list: ${PEERS}"
              cat >/tmp/peers.yaml <<EOF
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: configd-peers
                namespace: configd
                labels:
                  app: configd
                  component: bootstrap
              data:
                peers: "${PEERS}"
                replicas: "${REPLICAS}"
                bootstrapped-at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              EOF
              kubectl apply -f /tmp/peers.yaml
          env:
            - name: CONFIGD_REPLICAS
              value: "3"
          # The script needs a writable scratch dir for /tmp/peers.yaml
          # because the root filesystem is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: tmp
          # Writable scratch dir for /tmp/peers.yaml (read-only root filesystem).
          emptyDir:
            sizeLimit: 4Mi

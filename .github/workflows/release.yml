name: Release

# Tag-driven release pipeline.
#
# Trigger: push of a `vX.Y.Z` tag.
# Output:
#   - Container image at ghcr.io/<owner>/<repo>:<version>
#   - Cosign-signed manifest digest (keyless, GitHub OIDC)
#   - SLSA build provenance attestation
#   - CycloneDX SBOM attached to the GitHub release
#
# This pipeline does not handle paging integration; wire your paging service to
# the alert rules under ops/alerts/ separately.
#
# Every action is pinned to a full commit SHA (with a trailing version comment)
# because this workflow produces and signs published artifacts.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write       # publish GH release
  packages: write       # push image to GHCR
  id-token: write       # OIDC for cosign keyless + SLSA
  attestations: write   # GitHub Artifact Attestations / SLSA

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Verify version tag matches POM
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pom_version=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          if [ "$tag_version" != "$pom_version" ]; then
            echo "Tag version ($tag_version) does not match POM version ($pom_version)"
            exit 1
          fi

      - name: Full reactor verify
        run: ./mvnw clean verify --no-transfer-progress

      # The CycloneDX SBOM is attached to the GitHub release. Run over the full
      # reactor (not `-N`): with `-N` (non-recursive) makeAggregateBom only sees
      # the root aggregator POM and emits a 0-component SBOM, whereas the full
      # reactor aggregates every module's dependency graph.
      - name: Generate CycloneDX SBOM
        run: ./mvnw --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.0:makeAggregateBom

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push runtime image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reproducible build - pin SOURCE_DATE_EPOCH to the commit timestamp.
          build-args: |
            SOURCE_DATE_EPOCH=${{ github.event.head_commit.timestamp }}
          provenance: true
          sbom: true

      # Runtime-image vulnerability scan. The CI workflow only Trivy-scans the
      # source filesystem; the release MUST also scan the just-built runtime
      # image before signing, otherwise a CVE in a base-image layer would be
      # signed and attested as "released" without ever being inspected. Mirrors
      # the CI severity and exit code so a HIGH/CRITICAL CVE fails the release.
      # Intentionally does NOT set ignore-unfixed: true, which would mask CVEs
      # whose only mitigation is a base-image rebuild.
      - name: Trivy runtime image scan
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561 # v0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

      # Keyless cosign signing using GitHub OIDC.
      # Verify with: cosign verify --certificate-identity-regexp=...
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      # SLSA Level 3 build provenance via GitHub Artifact Attestations.
      # Verify with: gh attestation verify <image>@<digest> --owner <org>
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            target/bom.json
          body: |
            ## Container image

            `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}`

            ### Verification

            ```
            cosign verify \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

            gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }} \
              --owner ${{ github.repository_owner }}
            ```

            See `ops/runbooks/release.md` for the full release verification protocol.

  # Third-party re-verification. After build-and-publish has pushed, signed, and
  # attested the image, this job re-pulls it as a consumer would and re-runs the
  # exact verification commands the runbook documents. If either check fails the
  # release is broken even if the publish job reported success, so this job must
  # have run green against a real tag push before the signing/provenance claims
  # can be trusted.
  verify-published:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write   # cosign verify reads the OIDC keyset; no signing
    env:
      DIGEST: ${{ needs.build-and-publish.outputs.image-digest }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Log in to GHCR (read-only pull)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image by digest
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "FAIL: build-and-publish did not emit an image-digest output."
            exit 1
          fi
          docker pull "${IMAGE}@${DIGEST}"

      - name: Verify Cosign signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Verify SLSA build provenance
        run: |
          set -euo pipefail
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Cross-check via gh attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${IMAGE}@${DIGEST}" \
            --owner "${{ github.repository_owner }}"

      - name: Record verification evidence
        run: |
          {
            echo "## Release verify-published evidence"
            echo
            echo "- Image: ${IMAGE}@${DIGEST}"
            echo "- Cosign signature: VERIFIED"
            echo "- SLSA provenance (cosign): VERIFIED"
            echo "- SLSA provenance (gh attestation): VERIFIED"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"

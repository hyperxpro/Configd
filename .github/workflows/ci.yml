name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full run at 03:17 UTC. The full path adds the heavy work that is
    # skipped for fast pull-request feedback: mutation testing, the integrated
    # chaos and consistency sweeps, the large deterministic seed sweeps, and the
    # security supply-chain scans (CVE, secret, and byte-for-byte reproducibility).
    # GitHub fires `schedule` only from the default branch; use the
    # workflow_dispatch input below to run the same full path on demand.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      run_full_nightly:
        description: 'Run the full nightly path (mutation testing, integrated chaos sweeps, large seed sweeps, supply-chain scans) instead of the fast subset'
        type: boolean
        default: false

# Least privilege: read-only token by default. Jobs that need more request it
# per job (none here do; the release workflow grants write scopes).
permissions:
  contents: read

# Cancel superseded in-progress runs for the same pull request; a new push
# obsoletes the old run. Scoped to pull_request only so push-to-main and the
# nightly schedule always run to completion and every landed commit gets a full,
# uncancelled result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Parallel fan-out. Every verification job runs independently and concurrently;
# there is deliberately no serial dependency chain between them. Each job runs
# only its own unique work on a fresh, isolated runner and reports its own
# status. The cumulative "everything passed" guarantee is provided by the
# ci-success job at the bottom, which depends on every pull-request-gating job
# and fails unless all of them succeeded. Make ci-success the single required
# status check in branch protection.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.8.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          cache: maven

      - name: Build and unit test
        run: mvn clean install --no-transfer-progress -Dmaven.test.failure.ignore=false

      - name: Property-based tests
        run: mvn test -pl configd-common,configd-config-store,configd-consensus-core -am --no-transfer-progress -Dtest="*PropertyTest*,*Property*" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Simulation tests
        run: mvn test -pl configd-testkit -am --no-transfer-progress -Dtest="*Simulation*,*EndToEnd*,*Consistency*" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Seed sweep (10k seeds)
        run: mvn test -pl configd-testkit -am --no-transfer-progress -Dtest="SeedSweepTest" -Dconfigd.seedSweep.count=10000 -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  tlc-model-check:
    # Model-check the three TLA+ specifications with TLC at their full configs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Download TLC
        run: |
          mkdir -p tools
          curl -L -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      - name: Run TLC model checker
        run: |
          cd spec
          echo "== ConsensusSpec =="
          java -jar ../tools/tla2tools.jar -config ConsensusSpec.cfg -workers auto ConsensusSpec.tla
          echo "== ReadIndexSpec =="
          java -jar ../tools/tla2tools.jar -config ReadIndexSpec.cfg -workers auto ReadIndexSpec.tla
          echo "== SnapshotInstallSpec =="
          java -jar ../tools/tla2tools.jar -config SnapshotInstallSpec.cfg -workers auto SnapshotInstallSpec.tla
        timeout-minutes: 30

  gate:
    # One matrixed job covering the homogeneous verification gates. Each leg
    # invokes its own gates/gate-*.sh script; those scripts are the source of
    # truth for what is checked and are not modified here. Per-event flag
    # selection runs the fast subset on push/pull_request and the full path on
    # the nightly schedule or a manual full-nightly dispatch, matching each
    # script's own fast/nightly contract. Two verification jobs that need extra
    # setup are intentionally kept out of this matrix so they read clearly:
    # security-and-supply-chain (gitleaks install + NVD secret) and
    # multiraft-merge-seal (a fast artifact-existence seal that needs no JDK).
    #
    # Flag selection uses the GitHub Actions `cond && A || B` idiom. Keep every
    # nightly_flags value non-empty whenever it differs from fast_flags: an empty
    # string is falsy and would silently fall through to fast_flags on the nightly
    # path, which would be a coverage downgrade. The only leg with empty flags is
    # verify-and-selftest, whose fast and nightly runs are identical anyway.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Never cancel sibling gates when one fails: each gate is an independent
      # signal, exactly as when they were separate jobs.
      fail-fast: false
      matrix:
        include:
          # Clean build/verify, linearizability-checker self-tests, JMH and TLC
          # smoke, and a 3-node failover smoke. Same work on every event.
          - name: verify-and-selftest
            script: gates/gate-1.sh
            log_env: GATE1_LOG_DIR
            needs_go: true
            fast_flags: ''
            nightly_flags: ''
            timeout_fast: 45
            timeout_nightly: 45
          # Discriminating consensus tests, the adversarial seed sweep,
          # linearizability, jcstress, and (nightly) the PIT mutation thresholds.
          - name: consensus-correctness
            script: gates/gate-2.sh
            log_env: GATE2_LOG_DIR
            needs_go: true
            fast_flags: 'GATE2_SKIP_GATE1=1 GATE2_SKIP_MUTATION=1'
            nightly_flags: 'GATE2_SKIP_GATE1=1'
            timeout_fast: 90
            timeout_nightly: 180
          # Edge data plane: contract map, edge seed sweep, propagation probe,
          # slow-consumer walk, Compose end-to-end, and (nightly) new-module PIT.
          - name: edge-data-plane
            script: gates/gate-3.sh
            log_env: GATE3_LOG_DIR
            needs_go: false
            fast_flags: 'GATE3_SKIP_GATE2=1 GATE3_SKIP_MUTATION=1'
            nightly_flags: 'GATE3_SKIP_GATE2=1'
            timeout_fast: 120
            timeout_nightly: 180
          # Durability, recovery, and chaos. The fast subset runs the liveness,
          # reconfiguration, durability, edge-chaos, partition, and overload
          # cells; the heavy integrated chaos sweeps run only on the nightly path.
          - name: durability-and-chaos
            script: gates/gate-4.sh
            log_env: GATE4_LOG_DIR
            needs_go: false
            fast_flags: 'GATE4_SKIP_GATE3=1 GATE4_SKIP_NIGHTLY=1'
            nightly_flags: 'GATE4_SKIP_GATE3=1'
            timeout_fast: 60
            timeout_nightly: 120
          # Performance regression gate (allocation, tail-latency, throughput
          # smoke, backpressure bound). Identical work on every event.
          - name: performance
            script: gates/gate-5.sh
            log_env: GATE5_LOG_DIR
            needs_go: true
            fast_flags: 'GATE5_SKIP_GATE4=1'
            nightly_flags: 'GATE5_SKIP_GATE4=1'
            timeout_fast: 60
            timeout_nightly: 60
          # Operability: metric/alert emission contract, promtool alert tests,
          # wire byte-stability, cold start, backup/restore, and a game-day drill.
          - name: operability
            script: gates/gate-6.sh
            log_env: GATE6_LOG_DIR
            needs_go: false
            fast_flags: 'GATE6_SKIP_GATE5=1'
            nightly_flags: 'GATE6_SKIP_GATE5=1'
            timeout_fast: 30
            timeout_nightly: 30
          # Per-group owner-thread re-threading and the group-rehoming hazard
          # closure. The heavy 20k-seed deterministic sim runs on the nightly path.
          - name: raft-owner-threading
            script: gates/gate-phase0.sh
            log_env: GATE_PHASE0_LOG_DIR
            needs_go: false
            fast_flags: 'GATE_PHASE0_SKIP_GATE7=1 GATE_PHASE0_SKIP_SIM=1'
            nightly_flags: 'GATE_PHASE0_SKIP_GATE7=1'
            timeout_fast: 45
            timeout_nightly: 60
          # Static-N sharding layer and its multi-shard simulator invariants.
          # Fast runs a 200-seed sweep; the nightly path runs the 10k-seed sweep.
          - name: sharding
            script: gates/gate-phase1.sh
            log_env: GATE_PHASE1_LOG_DIR
            needs_go: false
            fast_flags: 'GATE_PHASE1_SKIP_CHAIN=1 GATE_PHASE1_SWEEP_COUNT=200'
            nightly_flags: 'GATE_PHASE1_SKIP_CHAIN=1 GATE_PHASE1_SWEEP_COUNT=10000'
            timeout_fast: 30
            timeout_nightly: 45
          # Multi-shard client-facing WATCH seal: the aggregating fan-out/fan-in
          # coordinator, the shard-complete _acl/ authz plane (the B6 regression), the
          # guard-flip legacy-SUBSCRIBE split, and edge wire byte-stability. Same work
          # on every event (targeted, fast); no chain.
          - name: multi-shard-watch
            script: gates/gate-mswatch.sh
            log_env: GATE_MSWATCH_LOG_DIR
            needs_go: false
            fast_flags: ''
            nightly_flags: ''
            timeout_fast: 25
            timeout_nightly: 25
    steps:
      # None of the matrixed gates need git history; the two verification jobs
      # that do (security-and-supply-chain, multiraft-merge-seal) are separate.
      - uses: actions/checkout@v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@v4.8.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Set up Go (builds the Porcupine linearizability checker)
        if: ${{ matrix.needs_go }}
        uses: actions/setup-go@v5.6.0
        with:
          # The checker is built with GOTOOLCHAIN=local, so the installed
          # toolchain must satisfy the module's "go" directive; read it from go.mod.
          go-version-file: configd-linz/src/main/go/porcupine-check/go.mod
          cache-dependency-path: configd-linz/src/main/go/porcupine-check/go.sum

      - name: Run ${{ matrix.name }}
        env:
          SCRIPT: ${{ matrix.script }}
          LOG_ENV: ${{ matrix.log_env }}
          LOG_DIR: ${{ runner.temp }}/gate-logs
          # Fast subset on push/pull_request; full path on the nightly schedule
          # or a manual full-nightly dispatch. See the empty-string caveat above.
          FLAGS: ${{ (github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true') && matrix.nightly_flags || matrix.fast_flags }}
        # `env ${FLAGS} ...` (not a bare `${FLAGS} ...`) because the shell only
        # recognizes VAR=val assignment prefixes at parse time; assignments that
        # arrive by variable expansion must be applied by the env utility.
        run: |
          export "${LOG_ENV}=${LOG_DIR}"
          env ${FLAGS} bash "${SCRIPT}"
        timeout-minutes: ${{ (github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true') && matrix.timeout_nightly || matrix.timeout_fast }}

      - name: Upload ${{ matrix.name }} logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: ${{ matrix.name }}-logs
          path: ${{ runner.temp }}/gate-logs
          retention-days: 7

  security-and-supply-chain:
    # Security and supply chain, proven by negative tests (attack performed,
    # refusal asserted): at-rest integrity, mTLS on both planes, wire fuzzing,
    # API authn/authz, replay, keyed-HMAC audit, SBOM match, reproducible-build
    # config. Kept as its own job because the nightly path adds a gitleaks binary
    # install and an NVD-keyed CVE scan. On push/pull_request the CVE scan, the
    # secret scan, and the two-build reproducibility proof loudly skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0  # the nightly gitleaks scan reads full history

      - name: Set up JDK 25
        uses: actions/setup-java@v4.8.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Run security gate (push/PR subset; CVE/secret/full-repro skipped)
        if: github.event_name != 'schedule' && github.event.inputs.run_full_nightly != 'true'
        run: GATE7_SKIP_GATE6=1 bash gates/gate-7.sh
        env:
          GATE7_LOG_DIR: ${{ runner.temp }}/security-and-supply-chain-logs
        timeout-minutes: 45

      - name: Install gitleaks (nightly secret scan)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: |
          set -euo pipefail
          GL_VER="8.18.4"
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          echo "GITLEAKS=/tmp/gitleaks" >> "$GITHUB_ENV"

      - name: Run security gate (nightly full; CVE scan + gitleaks + byte-repro)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: GATE7_SKIP_GATE6=1 GATE7_FULL=1 bash gates/gate-7.sh
        env:
          GATE7_LOG_DIR: ${{ runner.temp }}/security-and-supply-chain-logs
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # empty -> CVE step loudly skips, never assumed passing
        timeout-minutes: 90

      - name: Upload security-and-supply-chain logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: security-and-supply-chain-logs
          path: ${{ runner.temp }}/security-and-supply-chain-logs
          retention-days: 7

  multiraft-merge-seal:
    # Non-vacuity seal for the multi-Raft milestone: asserts the milestone
    # artifacts (contracts, gates, coalescing classes) still exist, so a deletion
    # fails the build instead of silently passing. Runs the same gates/gate-B.sh;
    # the cumulative test chain is supplied by the other jobs (SKIP_CHAIN), so
    # this is a fast check that needs no JDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0  # reads the merge-base with main for the baseline seal

      - name: Assert multi-Raft milestone artifacts exist
        run: GATE_B_SKIP_CHAIN=1 bash gates/gate-B.sh
        timeout-minutes: 5

  wire-compat:
    # Fails the build if the golden wire fixtures changed without a matching
    # bump to FrameCodec.WIRE_VERSION. Golden bytes are stored as hex constants
    # in GoldenFixtures.java, so diffs stay human-readable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0  # need history to diff against the base ref

      - name: Detect fixture-bytes change without WIRE_VERSION bump
        run: |
          set -euo pipefail
          FIXTURE_PATH="configd-transport/src/test/java/io/configd/transport/wirecompat/GoldenFixtures.java"
          CODEC_PATH="configd-transport/src/main/java/io/configd/transport/FrameCodec.java"

          # Pick the base reference to diff against:
          #   - PR:  merge-base(base_ref, HEAD) via three-dot
          #   - push: use before SHA if it still exists; fall back to HEAD~1
          if [[ -n "${{ github.base_ref }}" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
            DIFF_RANGE="$BASE_REF...HEAD"
          elif [[ -n "${{ github.event.before }}" \
              && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            DIFF_RANGE="${{ github.event.before }}...HEAD"
          elif git rev-parse HEAD~1 &>/dev/null; then
            DIFF_RANGE="HEAD~1...HEAD"
          else
            echo "Single-commit history — nothing to diff against, wire-compat clean."
            exit 0
          fi

          if ! git diff --quiet "$DIFF_RANGE" -- "$FIXTURE_PATH"; then
            echo "GoldenFixtures.java changed in $DIFF_RANGE:"
            git diff --stat "$DIFF_RANGE" -- "$FIXTURE_PATH"

            if git diff "$DIFF_RANGE" -- "$CODEC_PATH" | grep -qE '^[-+]\s*public\s+static\s+final\s+byte\s+WIRE_VERSION'; then
              echo "OK: FrameCodec.WIRE_VERSION also changed — fixture rebaseline is intentional."
            else
              echo "::error::GoldenFixtures.java changed but FrameCodec.WIRE_VERSION did not." >&2
              echo "::error::Either revert the fixture change or bump WIRE_VERSION and update GoldenFixtures (see ADR-0029 §8.10)." >&2
              exit 1
            fi
          else
            echo "No fixture changes in $DIFF_RANGE — wire-compat clean."
          fi

  linearizability-under-fault:
    # Live linearizability check under injected network faults: the unmodified
    # server binary is driven through seeded fault+workload schedules on 3- and
    # 5-node clusters and every operation history must check as linearizable. The
    # fault injector shells out to `sudo -n iptables` to isolate a node's inbound
    # Raft port, so the runner needs passwordless sudo and iptables, and the
    # multi-node clusters want more than 2 vCPUs of headroom. GitHub-hosted
    # ubuntu-latest provides passwordless sudo and iptables; if a larger or
    # self-hosted runner is available, swap the label below for more cores.
    #
    # Scheduled or manual only (never on push or pull_request) because of the
    # privileged, resource-heavy setup, and deliberately excluded from the
    # ci-success seal so it can never fail or block a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@v4.8.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Set up Go (builds the Porcupine linearizability checker)
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: configd-linz/src/main/go/porcupine-check/go.mod
          cache-dependency-path: configd-linz/src/main/go/porcupine-check/go.sum

      # Runs the checker self-tests, the sim-history check, and the live faulted
      # seed matrix (GATE2_FAULTED=1) via the linearizability step of gate-2.sh.
      - name: Run linearizability under injected network faults
        run: GATE2_FAULTED=1 bash gates/gate-2.sh --step linzgate
        env:
          GATE2_LOG_DIR: ${{ runner.temp }}/linz-fault-logs
        timeout-minutes: 120

      - name: Upload linearizability-under-fault logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: linearizability-under-fault-logs
          path: ${{ runner.temp }}/linz-fault-logs
          retention-days: 14

  ci-success:
    # Required-check seal. With the verification jobs fanned out in parallel,
    # this single job re-establishes the cumulative guarantee: it depends on
    # every pull-request-gating job and fails unless all of them succeeded. Make
    # THIS the sole required status check in branch protection. It deliberately
    # does not depend on linearizability-under-fault, which runs only on the
    # nightly schedule / manual dispatch and must never block a pull request.
    # `if: always()` so a failed or cancelled upstream still yields a definitive
    # red result here (a skipped aggregator would read as "no result" to branch
    # protection and could let a broken build merge).
    name: CI Success (all gates green)
    if: always()
    needs:
      - build-and-test
      - tlc-model-check
      - gate
      - security-and-supply-chain
      - multiraft-merge-seal
      - wire-compat
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have succeeded
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          failed=0
          for r in $results; do
            [ "$r" = "success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required CI jobs did not succeed (results: $results)"
            exit 1
          fi
          echo "All required CI jobs succeeded."

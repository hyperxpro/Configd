name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full gates (incl. the heavy PIT mutation step + the gate-4 heavy
    # integrated chaos sweeps) at 03:17 UTC. NOTE: GitHub only fires `schedule`
    # from the DEFAULT branch — until this file lands on `main`, the nightly is
    # configured-but-dormant on session branches. Use the workflow_dispatch
    # `run_full_nightly` input below to execute the exact nightly path on demand
    # in real CI (S5/RR-107: prove the nightly chaos job runs green once).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      run_full_nightly:
        description: 'Run the FULL nightly path (PIT mutation + gate-4 heavy integrated chaos sweeps / mini-Jepsen) instead of the fast CI subset'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          cache: maven

      - name: Build and unit test
        run: mvn clean install --no-transfer-progress -Dmaven.test.failure.ignore=false

      - name: Property-based tests
        run: mvn test -pl configd-common,configd-config-store,configd-consensus-core -am --no-transfer-progress -Dtest="*PropertyTest*,*Property*" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Simulation tests
        run: mvn test -pl configd-testkit -am --no-transfer-progress -Dtest="*Simulation*,*EndToEnd*,*Consistency*" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Seed sweep (10k seeds)
        run: mvn test -pl configd-testkit -am --no-transfer-progress -Dtest="SeedSweepTest" -Dconfigd.seedSweep.count=10000 -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  tlc-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download TLC
        run: |
          mkdir -p tools
          curl -L -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      - name: Run TLC model checker
        run: |
          cd spec
          echo "== ConsensusSpec =="
          java -jar ../tools/tla2tools.jar -config ConsensusSpec.cfg -workers auto ConsensusSpec.tla
          echo "== ReadIndexSpec =="
          java -jar ../tools/tla2tools.jar -config ReadIndexSpec.cfg -workers auto ReadIndexSpec.tla
          echo "== SnapshotInstallSpec =="
          java -jar ../tools/tla2tools.jar -config SnapshotInstallSpec.cfg -workers auto SnapshotInstallSpec.tla
        timeout-minutes: 30

  gate-1:
    # Session-1 cumulative gate (audit-session-1 Phase E): clean `./mvnw clean
    # verify` + count tripwire, Porcupine-gated linz self-tests (8/8, 0 skips),
    # JMH executability smoke (9 classes), TLC smoke bounds (gates/spec-smoke/),
    # 3-node failover smoke. See gates/gate-1.sh header for what a green run
    # does and does NOT prove (docs/readiness-register.md "Gate-1 blockers").
    # NOTE: runs the pinned wrapper (./mvnw); build-and-test above runs bare
    # `mvn` — that discrepancy is registered finding RR-071 (Session 5 owns it).
    # Estimated runtime on ubuntu-latest (4 vCPU): ~15-25 min, from per-step
    # measurements on the 2-vCPU audit box: build+suite 5.5-13 min (CPU-credit
    # dependent), linz 15s, JMH smoke ~2 min, TLC smoke ~2.5-8 min, multinode
    # ~10s; a cold Maven cache adds dependency-download time.
    # RR-094 (TF-9) RESOLVED in Session 2: the two keytool TLS tests
    # (find0050/find0051) had their expensive keytool fixture hoisted to an
    # un-budgeted @BeforeAll and a generous method-level @Timeout(120); they no
    # longer flake on slow/throttled runners. Gate-1 passes (lead's official
    # run 2026-06-11, TOTAL PASS 1214s).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Set up Go (builds the Porcupine checker in gate-1 step b)
        uses: actions/setup-go@v5
        with:
          # gate-1 builds with GOTOOLCHAIN=local, so the installed toolchain
          # must satisfy the go.mod "go" directive — read it from the file.
          go-version-file: configd-linz/src/main/go/porcupine-check/go.mod
          cache-dependency-path: configd-linz/src/main/go/porcupine-check/go.sum

      - name: Run gate-1
        run: bash gates/gate-1.sh
        env:
          GATE1_LOG_DIR: ${{ runner.temp }}/gate1-logs
        timeout-minutes: 45

      - name: Upload gate-1 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-1-logs
          path: ${{ runner.temp }}/gate1-logs
          retention-days: 7

  gate-2:
    # Session-2 cumulative gate (gates/gate-2.sh) — REQUIRES gate-1 (it runs it
    # as step a), then: named P0/P1 discriminating tests, the committed 507-seed
    # adversarial sweep, linearizability (checker self-tests + sim-history),
    # PIT mutation thresholds (consensus-core >=70 module / kernel, distribution
    # control-plane >=65), the curated jcstress subset, and the runtime-assertion
    # twin manifest. See gates/gate-2.sh header.
    #
    # Cost split: on push/PR the heavy ~3x-PIT mutation step is SKIPPED for fast
    # feedback (its thresholds are enforced on the nightly run + were verified
    # standalone in S2 — mutation-kill-list.md). The nightly schedule runs the
    # FULL gate incl. mutation. The live faulted linz matrix (sudo iptables) is
    # NOT run here — it is the self-hosted nightly variant (docs/session-2/
    # linz-plan.md §4); GATE2_FAULTED is left unset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Set up Go (Porcupine checker for the linzgate step)
        uses: actions/setup-go@v5
        with:
          go-version-file: configd-linz/src/main/go/porcupine-check/go.mod
          cache-dependency-path: configd-linz/src/main/go/porcupine-check/go.sum

      - name: Run gate-2 (push/PR — mutation skipped for speed)
        if: github.event_name != 'schedule' && github.event.inputs.run_full_nightly != 'true'
        run: GATE2_SKIP_MUTATION=1 bash gates/gate-2.sh
        env:
          GATE2_LOG_DIR: ${{ runner.temp }}/gate2-logs
        timeout-minutes: 90

      - name: Run gate-2 FULL (nightly — incl. PIT mutation thresholds)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: bash gates/gate-2.sh
        env:
          GATE2_LOG_DIR: ${{ runner.temp }}/gate2-logs
        timeout-minutes: 180

      - name: Upload gate-2 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-2-logs
          path: ${{ runner.temp }}/gate2-logs
          retention-days: 7

  gate-3:
    # Session-3 cumulative gate (gates/gate-3.sh) — the edge data plane.
    # REQUIRES gate-2 green (runs as its own job here, so the gate-3 run sets
    # GATE3_SKIP_GATE2=1 — cumulative coverage comes from the job dependency,
    # not a redundant re-run). Steps: contract-map end-state pin, the 507-seed
    # edge gate sweep + digest byte-identity, the propagation probe in BOTH
    # modes (sim + live boundary + live edge), the slow-consumer state-machine
    # walk, the four-phase Compose E2E scenario (docker available on
    # ubuntu-latest), the CT-34 JMH gc-profile check, and (nightly) the
    # new-module PIT floors (edge-cache + edge-node >= 65).
    needs: gate-2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Run gate-3 (push/PR — mutation skipped for speed)
        if: github.event_name != 'schedule' && github.event.inputs.run_full_nightly != 'true'
        run: GATE3_SKIP_GATE2=1 GATE3_SKIP_MUTATION=1 bash gates/gate-3.sh
        env:
          GATE3_LOG_DIR: ${{ runner.temp }}/gate3-logs
        timeout-minutes: 120

      - name: Run gate-3 FULL (nightly — incl. new-module PIT floors)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: GATE3_SKIP_GATE2=1 bash gates/gate-3.sh
        env:
          GATE3_LOG_DIR: ${{ runner.temp }}/gate3-logs
        timeout-minutes: 180

      - name: Upload gate-3 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-3-logs
          path: ${{ runner.temp }}/gate3-logs
          retention-days: 7

  gate-4:
    # Session-4 cumulative gate (gates/gate-4.sh) — durability, recovery & chaos.
    # REQUIRES gate-3 green (runs as its own job here, so the gate-4 run sets
    # GATE4_SKIP_GATE3=1 — cumulative coverage comes from the job dependency, not
    # a redundant re-run). CI-subset steps (push/PR): the RR-103/RR-095 liveness
    # regression seeds, D§2 reconfiguration-under-fault, the A3 edge-chaos legs,
    # the B-rest durability cells (RR-005, fsync-lie, ENOSPC, short-read), AND
    # workstreams C (partition/WAN — PartitionMatrixTest) and D (overload —
    # OverloadChaosTest), which run UNCONDITIONALLY in the CI subset. The HEAVY
    # integrated sweeps (EdgeIntegratedNightlySweepTest, the RR-095 integrated
    # rerun, and workstream E's MiniJepsenSweepTest) run ONLY on the nightly path
    # (schedule, or workflow_dispatch with run_full_nightly=true) — the push/PR
    # GATE4_SKIP_NIGHTLY=1 keeps the CI subset in CI time. (RR-106: this block
    # previously claimed C/D/E were "NOT YET IN GATE-4"; the code has run C+D in
    # the subset and E nightly since S4 — comment corrected 2026-06-14.)
    needs: gate-3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Run gate-4 (push/PR — gate-3 + heavy nightly sweeps skipped)
        if: github.event_name != 'schedule' && github.event.inputs.run_full_nightly != 'true'
        run: GATE4_SKIP_GATE3=1 GATE4_SKIP_NIGHTLY=1 bash gates/gate-4.sh
        env:
          GATE4_LOG_DIR: ${{ runner.temp }}/gate4-logs
        timeout-minutes: 60

      - name: Run gate-4 FULL (nightly — incl. the heavy integrated chaos sweeps)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: GATE4_SKIP_GATE3=1 bash gates/gate-4.sh
        env:
          GATE4_LOG_DIR: ${{ runner.temp }}/gate4-logs
        timeout-minutes: 120

      - name: Upload gate-4 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-4-logs
          path: ${{ runner.temp }}/gate4-logs
          retention-days: 7

  gate-5:
    # Session-5 cumulative gate (gates/gate-5.sh) — PERFORMANCE & capacity.
    # REQUIRES gate-4 green (runs as its own job here, so the gate-5 run sets
    # GATE5_SKIP_GATE4=1 — cumulative coverage comes from the job dependency, not
    # a redundant re-run). Locks in the Session-5 wins so Sessions 6-8 cannot
    # silently erode them: read-path 0 B/op (jmh-gc-check), read p99/p999 latency
    # REGRESSION bounds (JMH SampleTime/HdrHistogram), a throughput SMOKE floor
    # (RaftCommitBenchmark in-memory), the §11 as-built write bound
    # (maxPendingProposals=1024, Workstream D / RR-110), and a coordinated-omission
    # self-check (tails via SampleTime, CO-correct harnesses present). Collector
    # ZGC (ADR-0041). The FULL soak + sustained 10k/s + 100k/s burst are NOT a
    # CI job — the soak is a 24h lead-launched background run and the sustained/
    # burst rates are ENV-BLOCKED on CI hardware (manifest M-9/M-10); they live as
    # docs/session-5 captures + the perf nightly lane (the nightly path below runs
    # the full gate-5, incl. the unskipped steps, captured).
    needs: gate-4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Set up Go (gate-5 chains jmh-gc-check; gate-4 chain needs the Porcupine checker if unskipped)
        uses: actions/setup-go@v5
        with:
          go-version-file: configd-linz/src/main/go/porcupine-check/go.mod
          cache-dependency-path: configd-linz/src/main/go/porcupine-check/go.sum

      # gate-5 always SKIPs the gate-4 chain (GATE5_SKIP_GATE4=1) — cumulative
      # coverage of gates 1-4 comes from the gate-4 JOB dependency (which itself
      # runs the full chaos chain on the nightly path), exactly like gate-4 sets
      # GATE4_SKIP_GATE3=1. Re-running the chain inside gate-5 would double the
      # work. gate-5's own perf-regression steps are identical on every event, so
      # there is no separate nightly variant; the nightly schedule simply captures
      # the perf gate alongside the full gate-4 chaos run (the perf nightly lane).
      - name: Run gate-5 (perf regression gate; gate-4 chain via the job dependency)
        run: GATE5_SKIP_GATE4=1 bash gates/gate-5.sh
        env:
          GATE5_LOG_DIR: ${{ runner.temp }}/gate5-logs
        timeout-minutes: 60

      - name: Upload gate-5 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-5-logs
          path: ${{ runner.temp }}/gate5-logs
          retention-days: 7

  gate-6:
    # Session-6 cumulative gate (gates/gate-6.sh) — OPERABILITY & deployment readiness.
    # REQUIRES gate-5 green (runs as its own job here, so the gate-6 run sets
    # GATE6_SKIP_GATE5=1 — cumulative coverage via the job dependency, like every prior
    # gate). Locks the operability bar so Sessions 7-8 cannot silently erode it: every
    # dashboard panel + alert series is PROVEN EMITTED and the SLO series RECORDED with
    # real data (metric-contract), every alert FIRES on its condition and STAYS QUIET on
    # normal op (promtool), wire byte-stability N<->N+1 (golden fixtures), zero-state cold
    # start, backup/restore state-equality, and the alert->runbook->recovery loop closes
    # for one scenario. gate-6 downloads a pinned promtool. The full multi-node game-day
    # drill is the nightly/ops lane (gates/game-day-drill.sh wraps e2e-compose-scenario.sh,
    # itself a gate-3 step) — captured, not in the fast gate.
    needs: gate-5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Run gate-6 (operability gate; gates 1..5 via the job dependency)
        run: GATE6_SKIP_GATE5=1 bash gates/gate-6.sh
        env:
          GATE6_LOG_DIR: ${{ runner.temp }}/gate6-logs
        timeout-minutes: 30

      - name: Upload gate-6 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-6-logs
          path: ${{ runner.temp }}/gate6-logs
          retention-days: 7

  gate-7:
    # Session-7 cumulative gate (gates/gate-7.sh) — SECURITY & supply chain.
    # REQUIRES gate-6 green (runs as its own job here, so the gate-7 run sets
    # GATE7_SKIP_GATE6=1 — cumulative coverage via the job dependency, like every
    # prior gate). Locks the security bar so Session 8 cannot silently erode it:
    # PA-2021 at-rest integrity (tampered snapshot/WAL/raft-state + forged
    # install-snapshot REFUSED; ADR-0042), mTLS adversarially verified on BOTH
    # planes (plaintext/expired/wrong-SAN/TLSv1.2-downgrade refused), wire-protocol
    # fuzz (resource oracle — no crash/OOM/unbounded-alloc/hang), API authn/authz
    # (401 vs 403) + verbatim-replay 409 + KEYED-HMAC tamper-evident audit, the
    # committed CycloneDX SBOM matches a fresh generation, and reproducible-build
    # config (project.build.outputTimestamp). The S4 durability cells re-run inside
    # the PA-2021 step prove no recovery-path regression.
    #
    # ENV-BLOCKED-on-fast-path steps run on the NIGHTLY path (charter §10.8): the
    # OWASP dependency-check NVD CVE scan (needs NVD_API_KEY + network), the
    # gitleaks secret scan (needs the binary), and the two-build byte-identical
    # reproducibility proof (GATE7_FULL=1). On push/PR they loud-skip.
    needs: gate-6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks (nightly) scans history

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Run gate-7 (push/PR — CVE/secret/full-repro loud-skipped, run nightly)
        if: github.event_name != 'schedule' && github.event.inputs.run_full_nightly != 'true'
        run: GATE7_SKIP_GATE6=1 bash gates/gate-7.sh
        env:
          GATE7_LOG_DIR: ${{ runner.temp }}/gate7-logs
        timeout-minutes: 45

      - name: Install gitleaks (nightly secret scan)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: |
          set -euo pipefail
          GL_VER="8.18.4"
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          echo "GITLEAKS=/tmp/gitleaks" >> "$GITHUB_ENV"

      - name: Run gate-7 FULL (nightly — CVE scan + gitleaks + byte-repro proof)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: GATE7_SKIP_GATE6=1 GATE7_FULL=1 bash gates/gate-7.sh
        env:
          GATE7_LOG_DIR: ${{ runner.temp }}/gate7-logs
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # empty → CVE step loud-skips (honest, never assumed-passing)
        timeout-minutes: 90

      - name: Upload gate-7 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-7-logs
          path: ${{ runner.temp }}/gate7-logs
          retention-days: 7

  gate-phase0:
    # Phase 0 Workstream B cumulative gate (gates/gate-phase0.sh) — the R-01 re-threading
    # (single tick thread → one owner thread per group) + the H-4 group-rehoming hazard closure.
    # REQUIRES gates 1..7 green (each runs as its own job, so this sets GATE_PHASE0_SKIP_GATE7=1 —
    # cumulative coverage via the job dependency, like every prior gate). Proves: the owner net is
    # non-vacuous at N>1 (a cross-group access on a real foreign owner trips the per-node net); the
    # H-4 rehoming MECHANISM (quiesce→publish→adopt + check-and-bounce + the deferred sub-mechanisms +
    # the red-team/replay robustness fixes); H-4 no-double-ownership at the JMM level (jcstress, the
    # rehoming proofs run at -m quick where the broken control reliably fails); and the S2–S4 invariant
    # surface WITH rehoming injected (zero off-owner fires across tens of thousands of handoffs, groups
    # keep committing). The heavy 20,001-seed deterministic sim runs on the NIGHTLY path (skipped on
    # push/PR for speed; cumulatively covered by gate-1's failover smoke + gate-2's seed sweep).
    needs: gate-7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Run gate-phase0 (push/PR — 20k sim skipped for speed, run nightly)
        if: github.event_name != 'schedule' && github.event.inputs.run_full_nightly != 'true'
        run: GATE_PHASE0_SKIP_GATE7=1 GATE_PHASE0_SKIP_SIM=1 bash gates/gate-phase0.sh
        env:
          GATE_PHASE0_LOG_DIR: ${{ runner.temp }}/gate-phase0-logs
        timeout-minutes: 45

      - name: Run gate-phase0 FULL (nightly — incl. the 20,001-seed deterministic sim)
        if: github.event_name == 'schedule' || github.event.inputs.run_full_nightly == 'true'
        run: GATE_PHASE0_SKIP_GATE7=1 bash gates/gate-phase0.sh
        env:
          GATE_PHASE0_LOG_DIR: ${{ runner.temp }}/gate-phase0-logs
        timeout-minutes: 60

      - name: Upload gate-phase0 step logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-phase0-logs
          path: ${{ runner.temp }}/gate-phase0-logs
          retention-days: 7

  wire-compat:
    # ADR-0029 §8.10 fixture-bump guardrail.
    # Fails the build if GoldenFixtures.java changed without a matching bump
    # to FrameCodec.WIRE_VERSION. Golden bytes are stored as hex constants in
    # GoldenFixtures.java rather than binary files — diffs stay human-readable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff against the base ref

      - name: Detect fixture-bytes change without WIRE_VERSION bump
        run: |
          set -euo pipefail
          FIXTURE_PATH="configd-transport/src/test/java/io/configd/transport/wirecompat/GoldenFixtures.java"
          CODEC_PATH="configd-transport/src/main/java/io/configd/transport/FrameCodec.java"

          # Pick the base reference to diff against:
          #   - PR:  merge-base(base_ref, HEAD) via three-dot
          #   - push: use before SHA if it still exists; fall back to HEAD~1
          if [[ -n "${{ github.base_ref }}" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
            DIFF_RANGE="$BASE_REF...HEAD"
          elif [[ -n "${{ github.event.before }}" \
              && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            DIFF_RANGE="${{ github.event.before }}...HEAD"
          elif git rev-parse HEAD~1 &>/dev/null; then
            DIFF_RANGE="HEAD~1...HEAD"
          else
            echo "Single-commit history — nothing to diff against, wire-compat clean."
            exit 0
          fi

          if ! git diff --quiet "$DIFF_RANGE" -- "$FIXTURE_PATH"; then
            echo "GoldenFixtures.java changed in $DIFF_RANGE:"
            git diff --stat "$DIFF_RANGE" -- "$FIXTURE_PATH"

            if git diff "$DIFF_RANGE" -- "$CODEC_PATH" | grep -qE '^[-+]\s*public\s+static\s+final\s+byte\s+WIRE_VERSION'; then
              echo "OK: FrameCodec.WIRE_VERSION also changed — fixture rebaseline is intentional."
            else
              echo "::error::GoldenFixtures.java changed but FrameCodec.WIRE_VERSION did not." >&2
              echo "::error::Either revert the fixture change or bump WIRE_VERSION and update GoldenFixtures (see ADR-0029 §8.10)." >&2
              exit 1
            fi
          else
            echo "No fixture changes in $DIFF_RANGE — wire-compat clean."
          fi

# Configd SLO / failure alert rules for Prometheus / Alertmanager.
#
# Each rule is tagged RATIFIED (threshold confirmed against a measured distribution) or PROPOSED
# (plausible but not yet exercised under real load). Treat PROPOSED thresholds as provisional.
#
# `cluster` and `instance` come from the Prometheus scrape config, not the app: the registry has no
# label support, so the series names here are the bare app names.
#
# ops/alerts/configd-slo-alerts.test.yaml proves each rule fires on its injected condition and stays
# quiet on normal operation.

groups:
  - name: configd-slo-write-commit
    interval: 30s
    rules:
      # RATIFIED: SLO 99% of write commits < 150 ms. Measured commit p99 was 5.4 ms with a worst window
      # of 10.8 ms through injected faults, a 14x margin under the budget. The cross-region budget stays
      # PROPOSED: it was never exercised on a single-box run.
      - alert: ConfigdWriteCommitFastBurn
        expr: |
          (
            sum(rate(configd_write_commit_seconds_bucket{le="0.150"}[5m]))
            /
            sum(rate(configd_write_commit_seconds_count[5m]))
          ) < (1 - 14.4 * (1 - 0.99))
        for: 2m
        labels: {severity: page, slo: write.commit.latency.p99}
        annotations:
          summary: "Write commit p99 burning fast (14.4x rate, 5m window)"
          description: "Fraction of commits under the 150 ms budget has dropped below the 14.4x burn-rate threshold; 2% of the monthly error budget will burn in <1h. Investigate the Raft commit pipeline."
          runbook_url: ops/runbooks/write-commit-latency.md
      - alert: ConfigdWriteCommitSlowBurn
        expr: |
          (
            sum(rate(configd_write_commit_seconds_bucket{le="0.150"}[1h]))
            /
            sum(rate(configd_write_commit_seconds_count[1h]))
          ) < (1 - 6 * (1 - 0.99))
        for: 15m
        labels: {severity: page, slo: write.commit.latency.p99}
        annotations:
          summary: "Write commit p99 burning at 6x rate (1h window)"
          runbook_url: ops/runbooks/write-commit-latency.md

  - name: configd-slo-edge-read
    interval: 30s
    rules:
      # PROPOSED: SLO 99% of edge reads < 1 ms. Measured p99 = 1.60 us, ~600x headroom, so this should
      # essentially never fire; if it does the edge read path has regressed badly. Served by the EDGE
      # process /metrics, not the control plane.
      - alert: ConfigdEdgeReadFastBurn
        expr: |
          (
            sum(rate(configd_edge_read_seconds_bucket{le="0.001"}[5m]))
            /
            sum(rate(configd_edge_read_seconds_count[5m]))
          ) < (1 - 14.4 * (1 - 0.99))
        for: 2m
        labels: {severity: page, slo: edge.read.latency.p99}
        annotations:
          summary: "Edge read p99 burning fast (14.4x rate, 5m window)"
          runbook_url: ops/runbooks/edge-read-latency.md
      # PROPOSED: p999 symptom view, warn-only. Measured p999 = 32 us against a 5 ms ceiling. Not a
      # paging burn-rate gate.
      - alert: ConfigdEdgeReadP999Breach
        expr: |
          histogram_quantile(0.999, sum by (le) (rate(configd_edge_read_seconds_bucket[5m]))) > 0.005
        for: 5m
        labels: {severity: warn, slo: edge.read.latency.p999}
        annotations:
          summary: "Edge read p999 > 5 ms"
          runbook_url: ops/runbooks/edge-read-latency.md

  - name: configd-slo-edge-staleness
    interval: 30s
    rules:
      # PROPOSED: thresholds are the consistency-contract state boundaries: CURRENT->STALE = 500 ms warn,
      # STALE->DEGRADED = 2 s page. Measured staleness p99 = 255 ms local; the global propagation budget is
      # not confirmed under real cross-region load. Do not page on the monotonic-read invariant counter
      # alone, staleness is the operator signal.
      - alert: ConfigdEdgeStalenessWarn
        expr: max(edge_staleness_ms) > 500
        for: 2m
        labels: {severity: warn, slo: edge.staleness.p99}
        annotations:
          summary: "Edge staleness > 500 ms (CURRENT->STALE boundary)"
          runbook_url: ops/runbooks/propagation-delay.md
      - alert: ConfigdEdgeStalenessDegraded
        expr: max(edge_staleness_ms) > 2000
        for: 1m
        labels: {severity: page, slo: edge.staleness.p99}
        annotations:
          summary: "Edge staleness > 2 s (STALE->DEGRADED) — fan-out propagation stalled"
          runbook_url: ops/runbooks/propagation-delay.md

  - name: configd-availability
    interval: 1m
    rules:
      # PROPOSED: control-plane write availability SLO 99.999% over 30m. The denominator is failed+total,
      # so a full outage still pages instead of going NaN on a zero-success window.
      - alert: ConfigdControlPlaneAvailability
        expr: |
          (
            1 - (
              sum(rate(configd_write_commit_failed_total[30m]))
              /
              (
                sum(rate(configd_write_commit_failed_total[30m]))
                + sum(rate(configd_write_commit_total[30m]))
              )
            )
          ) < 0.99999
        for: 10m
        labels: {severity: page, slo: control.plane.availability}
        annotations:
          summary: "Control-plane write availability < 99.999% over 30 min"
          runbook_url: ops/runbooks/control-plane-down.md

  - name: configd-overload
    interval: 30s
    rules:
      # PROPOSED: sustained write-overload shedding. The bounded proposal queue sheds at
      # maxPendingProposals=1024 with 429 + Retry-After, so sustained shedding means write pressure exceeds
      # commit throughput: scale writers or cores. Measured box ceiling ~125-172 commits/s; the shed
      # threshold itself is not confirmed under production load.
      - alert: ConfigdWriteOverloadShedding
        expr: rate(configd_write_rejected_overloaded_total[5m]) > 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Sustained write 429s (bounded proposal queue shedding)"
          runbook_url: ops/runbooks/overload-shedding.md
      # PROPOSED: observes only, there is no shed on this path. A leader that commits but cannot apply
      # (slow disk) accrues commitIndex-lastApplied. 5000 is a heuristic ceiling since the backlog is ~0 in
      # steady state.
      - alert: ConfigdRaftApplyBacklog
        expr: max(configd_raft_pending_apply_entries) > 5000
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Raft apply backlog > 5000 (leader applying slower than it commits)"
          runbook_url: ops/runbooks/raft-saturation.md

  - name: configd-integrity
    interval: 1m
    rules:
      # PROPOSED: 3 or more InstallSnapshot failures in 15m; a single transient self-clears via leader retry.
      - alert: ConfigdSnapshotInstallStalled
        expr: increase(configd_snapshot_install_failed_total[15m]) >= 3
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "InstallSnapshot failed >= 3 times in 15 min"
          runbook_url: ops/runbooks/snapshot-install.md
      # PROPOSED: clock-skew fence. edge_staleness_implausible_total counts a frontier dated in the future,
      # meaning control-plane/edge skew past the 500 ms HLC fence. Any sustained occurrence is worth a look.
      - alert: ConfigdClockSkewSuspected
        expr: increase(edge_staleness_implausible_total[15m]) >= 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Implausible (future-dated) edge frontier — clock skew suspected"
          runbook_url: ops/runbooks/edge-catchup-storm.md
      # PROPOSED: any ACL config-policy load rejection. The loader keeps last-good and never falls to
      # deny-all or allow-all, so a rejected reload is SILENT to clients yet means an `_acl/` write did not
      # take effect, and one persisted poison key freezes every later policy update until it is removed.
      # Write-time validation rejects most malformed `_acl/` writes pre-commit, but a key arriving via
      # snapshot replay can still trip this. Eager-created so it emits `_total 0` rather than going
      # unregistered.
      - alert: ConfigdAclPolicyLoadFailed
        expr: increase(configd_acl_policy_load_failed_total[15m]) >= 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "ACL config-policy load REJECTED — last-good policy frozen (an `_acl/` update did not apply)"
          runbook_url: ops/runbooks/acl-policy-load.md

  - name: configd-runtime-leaks
    interval: 1m
    rules:
      # RATIFIED: leak ceilings held with wide margin over a 72h fault-injected soak. Per-run maxima were
      # FD 144, threads 115, heap ratio 0.36, and all three were flat across the run. The ceilings below sit
      # 2.5-3.5x above those maxima so a real monotonic leak crosses them while GC-sawtooth noise never
      # does. The headroom is deliberate: do not tighten onto the measured peak, a larger fleet would
      # false-fire.
      - alert: ConfigdFileDescriptorLeak
        expr: max(process_open_fds) > 500
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Open FDs > 500 (72h-soak steady max 144) — descriptor leak suspected"
          runbook_url: ops/runbooks/resource-leak.md
      - alert: ConfigdThreadLeak
        expr: max(jvm_threads_current) > 400
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Thread count > 400 (72h-soak steady max 115) — thread leak suspected"
          runbook_url: ops/runbooks/resource-leak.md
      - alert: ConfigdHeapPressure
        expr: (max(jvm_heap_used_bytes) / max(jvm_heap_max_bytes)) > 0.9
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "Heap > 90% of max for 30 min — pressure or leak (ZGC should reclaim)"
          runbook_url: ops/runbooks/resource-leak.md

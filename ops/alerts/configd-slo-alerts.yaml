# Configd SLO / failure alert rules — Prometheus / Alertmanager.
#
# S6 reconciliation (operability): EVERY rule below queries a series that is now
# PROVEN EMITTED by a contract test (MetricsWiringContractTest /
# EdgeMetricsContractTest / DashboardSeriesContractTest) and RECORDED with real
# data on its real path — closing the S1 "6/9 alerts query never-emitted series"
# defect. The S5 ghost `configd_propagation_delay_seconds` alert is removed and
# replaced by the real, served `edge_staleness_ms` gauge (Decision Log D-2).
#
# THRESHOLDS ARE PROPOSED — derived from the S5 reference-hardware baselines (in the
# `# PROPOSED:` comment on each rule), to be CONFIRMED under real production load in
# the Session 7.5 infrastructure campaign (M-1…M-10). They are NOT load-validated.
#
# Labels: `cluster`/`instance` are added by the Prometheus scrape config (external
# labels / relabel), NOT emitted by the app (the registry has no label support) —
# the series names below are the bare app names. Each rule carries a runbook_url
# annotation routing the page to the runbook that was execution-validated in S6/WS-B.
#
# Test harness: ops/alerts/configd-slo-alerts.test.yaml (promtool test rules) proves
# each rule FIRES on its injected condition and STAYS QUIET on normal operation.

groups:
  # ----------------------------------------------------------------------------
  - name: configd-slo-write-commit
    interval: 30s
    rules:
      # PROPOSED: SLO 99% of write commits < 150 ms. S5 measured local commit p99 =
      # 16 ms (~9x headroom); burn-rate guards error-budget exhaustion. Cross-region
      # budget (<150 ms, 5-voter modeled ~84 ms) is M-1, confirm in S7.5.
      - alert: ConfigdWriteCommitFastBurn
        expr: |
          (
            sum(rate(configd_write_commit_seconds_bucket{le="0.150"}[5m]))
            /
            sum(rate(configd_write_commit_seconds_count[5m]))
          ) < (1 - 14.4 * (1 - 0.99))
        for: 2m
        labels: {severity: page, slo: write.commit.latency.p99}
        annotations:
          summary: "Write commit p99 burning fast (14.4x rate, 5m window)"
          description: "Fraction of commits under the 150 ms budget has dropped below the 14.4x burn-rate threshold; 2% of the monthly error budget will burn in <1h. Investigate the Raft commit pipeline."
          runbook_url: ops/runbooks/write-commit-latency.md
      - alert: ConfigdWriteCommitSlowBurn
        expr: |
          (
            sum(rate(configd_write_commit_seconds_bucket{le="0.150"}[1h]))
            /
            sum(rate(configd_write_commit_seconds_count[1h]))
          ) < (1 - 6 * (1 - 0.99))
        for: 15m
        labels: {severity: page, slo: write.commit.latency.p99}
        annotations:
          summary: "Write commit p99 burning at 6x rate (1h window)"
          runbook_url: ops/runbooks/write-commit-latency.md

  # ----------------------------------------------------------------------------
  - name: configd-slo-edge-read
    interval: 30s
    rules:
      # PROPOSED: SLO 99% of edge reads < 1 ms. S5 measured p99 = 1.60 us (~600x
      # headroom); this should essentially never fire — if it does, the edge read
      # path has regressed badly. Series is served by the EDGE process /metrics.
      - alert: ConfigdEdgeReadFastBurn
        expr: |
          (
            sum(rate(configd_edge_read_seconds_bucket{le="0.001"}[5m]))
            /
            sum(rate(configd_edge_read_seconds_count[5m]))
          ) < (1 - 14.4 * (1 - 0.99))
        for: 2m
        labels: {severity: page, slo: edge.read.latency.p99}
        annotations:
          summary: "Edge read p99 burning fast (14.4x rate, 5m window)"
          runbook_url: ops/runbooks/edge-read-latency.md
      # PROPOSED: p999 symptom view, warn-only. S5 p999 = 32 us; 5 ms is a generous
      # ceiling (~150x). Not a paging burn-rate gate.
      - alert: ConfigdEdgeReadP999Breach
        expr: |
          histogram_quantile(0.999, sum by (le) (rate(configd_edge_read_seconds_bucket[5m]))) > 0.005
        for: 5m
        labels: {severity: warn, slo: edge.read.latency.p999}
        annotations:
          summary: "Edge read p999 > 5 ms"
          runbook_url: ops/runbooks/edge-read-latency.md

  # ----------------------------------------------------------------------------
  - name: configd-slo-edge-staleness
    interval: 30s
    rules:
      # PROPOSED: replaces the S5 GHOST configd_propagation_delay_seconds alert with
      # the REAL served edge_staleness_ms gauge (ADR-0039 frontier). S5 staleness p99
      # = 255 ms local; thresholds are the consistency-contract state boundaries
      # (CURRENT->STALE = 500 ms warn, STALE->DEGRADED = 2 s page). Global propagation
      # (<500 ms) is M-2, confirm in S7.5. RR-099: do NOT page on the monotonic-read
      # invariant counter alone — staleness here is the operator signal.
      - alert: ConfigdEdgeStalenessWarn
        expr: max(edge_staleness_ms) > 500
        for: 2m
        labels: {severity: warn, slo: edge.staleness.p99}
        annotations:
          summary: "Edge staleness > 500 ms (CURRENT->STALE boundary)"
          runbook_url: ops/runbooks/propagation-delay.md
      - alert: ConfigdEdgeStalenessDegraded
        expr: max(edge_staleness_ms) > 2000
        for: 1m
        labels: {severity: page, slo: edge.staleness.p99}
        annotations:
          summary: "Edge staleness > 2 s (STALE->DEGRADED) — fan-out propagation stalled"
          runbook_url: ops/runbooks/propagation-delay.md

  # ----------------------------------------------------------------------------
  - name: configd-availability
    interval: 1m
    rules:
      # PROPOSED: control-plane write availability SLO 99.999% over 30m. Denominator
      # is failed+total (= attempts) so a full outage still pages (no NaN). Both
      # series are now RECORDED at the raftProposer site (D-2).
      - alert: ConfigdControlPlaneAvailability
        expr: |
          (
            1 - (
              sum(rate(configd_write_commit_failed_total[30m]))
              /
              (
                sum(rate(configd_write_commit_failed_total[30m]))
                + sum(rate(configd_write_commit_total[30m]))
              )
            )
          ) < 0.99999
        for: 10m
        labels: {severity: page, slo: control.plane.availability}
        annotations:
          summary: "Control-plane write availability < 99.999% over 30 min"
          runbook_url: ops/runbooks/control-plane-down.md

  # ----------------------------------------------------------------------------
  - name: configd-overload
    interval: 30s
    rules:
      # PROPOSED (RR-110 / D-1): sustained write-overload shedding. The bounded
      # proposal queue sheds at maxPendingProposals=1024 -> 429 + Retry-After. Any
      # sustained shedding (> 1 reject/s for 5m) means write pressure exceeds commit
      # throughput — scale writers/cores. Box ceiling is ~125-172 commits/s (M-9);
      # confirm the real shed threshold under load in S7.5 (M-10).
      - alert: ConfigdWriteOverloadShedding
        expr: rate(configd_write_rejected_overloaded_total[5m]) > 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Sustained write 429s (bounded proposal queue shedding)"
          runbook_url: ops/runbooks/overload-shedding.md
      # PROPOSED: apply-backlog OBSERVABILITY alert (RR-110: no 503 shed). A leader
      # that commits but cannot apply (slow disk) accrues commitIndex-lastApplied.
      # 5000 is a heuristic ceiling (apply backlog is ~0 in steady state); confirm S7.5.
      - alert: ConfigdRaftApplyBacklog
        expr: max(configd_raft_pending_apply_entries) > 5000
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Raft apply backlog > 5000 (leader applying slower than it commits)"
          runbook_url: ops/runbooks/raft-saturation.md

  # ----------------------------------------------------------------------------
  - name: configd-integrity
    interval: 1m
    rules:
      # PROPOSED: >= 3 InstallSnapshot failures in 15m (a single transient self-clears
      # via leader retry). Series RECORDED via ServerStateMachineMetrics.
      - alert: ConfigdSnapshotInstallStalled
        expr: increase(configd_snapshot_install_failed_total[15m]) >= 3
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "InstallSnapshot failed >= 3 times in 15 min"
          runbook_url: ops/runbooks/snapshot-install.md
      # PROPOSED: clock-skew fence signal. edge_staleness_implausible_total counts a
      # frontier dated in the future == control-plane/edge clock skew past the 500 ms
      # HLC fence (architecture §6.3). Any sustained occurrence is worth a look.
      - alert: ConfigdClockSkewSuspected
        expr: increase(edge_staleness_implausible_total[15m]) >= 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Implausible (future-dated) edge frontier — clock skew suspected"
          runbook_url: ops/runbooks/edge-catchup-storm.md
      # PROPOSED (O-6 Seam 2b): any ACL config-policy load rejection. The loader keeps last-good
      # (fail-closed — never deny-all / allow-all), so a rejected reload is SILENT to clients yet means an
      # `_acl/` write did NOT take effect, and one persisted poison key FREEZES every subsequent policy
      # update until it is removed (AclConfigPolicyLoaderTest#poisonKeyFreezesSubsequentUpdates). 2b's
      # write-time validation rejects most malformed `_acl/` writes pre-commit, but a key delivered via
      # snapshot/replay can still trip this. Series RECORDED via AclConfigPolicyLoader (eager-created ⇒
      # emits `_total 0`, no blind-dashboard series).
      - alert: ConfigdAclPolicyLoadFailed
        expr: increase(configd_acl_policy_load_failed_total[15m]) >= 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "ACL config-policy load REJECTED — last-good policy frozen (an `_acl/` update did not apply)"
          runbook_url: ops/runbooks/acl-policy-load.md

  # ----------------------------------------------------------------------------
  - name: configd-runtime-leaks
    interval: 1m
    rules:
      # PROPOSED leak ceilings from the S5 soak flats (3.45 h clean: FD 69, threads
      # 93, heap ~220-290 MB). A monotonic leak eventually crosses these generous
      # margins without the GC-sawtooth false positives a deriv() alert would suffer.
      # Confirm/tighten on real hardware in S7.5 (and the M-4 representative soak).
      - alert: ConfigdFileDescriptorLeak
        expr: max(process_open_fds) > 500
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Open FDs > 500 (S5 baseline ~69) — descriptor leak suspected"
          runbook_url: ops/runbooks/resource-leak.md
      - alert: ConfigdThreadLeak
        expr: max(jvm_threads_current) > 400
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Thread count > 400 (S5 baseline ~93) — thread leak suspected"
          runbook_url: ops/runbooks/resource-leak.md
      - alert: ConfigdHeapPressure
        expr: (max(jvm_heap_used_bytes) / max(jvm_heap_max_bytes)) > 0.9
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "Heap > 90% of max for 30 min — pressure or leak (ZGC should reclaim)"
          runbook_url: ops/runbooks/resource-leak.md
